<div class="page-container">
  <h1 class="page-title">Clientes</h1>

  <div class="card">
    <p-toolbar styleClass="mb-3">
      <ng-template pTemplate="start">
        <button pButton icon="pi pi-plus" label="Nuevo Cliente" (click)="nuevo()"></button>
      </ng-template>
      <ng-template pTemplate="end">
        <p-iconfield>
          <p-inputicon class="pi pi-search" />
          <input pInputText type="text" [(ngModel)]="filtroGlobal" (input)="tabla.filterGlobal(filtroGlobal, 'contains')" placeholder="Buscar..." />
        </p-iconfield>
      </ng-template>
    </p-toolbar>

    <p-table #tabla [value]="clientes()" [loading]="cargando()" [paginator]="true" [rows]="10" [globalFilterFields]="['identificacion','nombre','correo']" dataKey="id">
      <ng-template pTemplate="header">
        <tr>
          <th>Identificación</th>
          <th>Nombre</th>
          <th>Tipo</th>
          <th>Dirección</th>
          <th>Correo</th>
          <th>Estado</th>
          <th style="width: 8rem">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-cliente>
        <tr>
          <td>{{ cliente.identificacion }}</td>
          <td>{{ cliente.nombre }}</td>
          <td>
            <span class="badge" [class.badge-info]="cliente.tipo === 'Cliente'" [class.badge-warning]="cliente.tipo === 'Proveedor'" [class.badge-secondary]="cliente.tipo === 'Transportista'">
              {{ cliente.tipo }}
            </span>
          </td>
          <td>{{ cliente.direccion || '-' }}</td>
          <td>{{ cliente.correo || '-' }}</td>
          <td>
            <span class="badge" [class.badge-success]="cliente.estado" [class.badge-danger]="!cliente.estado">
              {{ cliente.estado ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          <td>
            <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" (click)="editar(cliente)"></button>
            <button pButton icon="pi pi-trash" class="p-button-text p-button-sm p-button-danger" (click)="eliminar(cliente)"></button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr><td colspan="7" style="text-align:center">No hay clientes registrados.</td></tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog [visible]="mostrarDialogo()" (visibleChange)="mostrarDialogo.set($event)" [modal]="true" [style]="{ width: '450px' }" [header]="esNuevo() ? 'Nuevo Cliente' : 'Editar Cliente'">
  <div class="form-grid">
    <div class="field">
      <label>Identificación *</label>
      <input pInputText [(ngModel)]="entidad.identificacion" />
    </div>
    <div class="field">
      <label>Nombre *</label>
      <input pInputText [(ngModel)]="entidad.nombre" />
    </div>
    <div class="field">
      <label>Dirección</label>
      <input pInputText [(ngModel)]="entidad.direccion" />
    </div>
    <div class="field">
      <label>Correo</label>
      <input pInputText [(ngModel)]="entidad.correo" />
    </div>
    <div class="field">
      <label>Tipo *</label>
      <p-select [options]="tipos" optionLabel="label" optionValue="value" [(ngModel)]="entidad.tipo" placeholder="Seleccione tipo" appendTo="body"></p-select>
    </div>
    <div class="field field-inline">
      <label>Activo</label>
      <p-toggleswitch [(ngModel)]="entidad.estado"></p-toggleswitch>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <button pButton label="Cancelar" class="p-button-text" (click)="mostrarDialogo.set(false)"></button>
    <button pButton label="Guardar" icon="pi pi-check" (click)="guardar()"></button>
  </ng-template>
</p-dialog>
